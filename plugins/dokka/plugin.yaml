tasks:
  dokkaHtml:
    action: !io.heapy.ktc.plugins.dokka.generateHtml
      settings: ${pluginSettings}
      moduleName: ${module.name}
      projectDir: ${project.rootDir}
      moduleDir: ${module.rootDir}
      dokkaClasspath:
        - org.jetbrains.dokka:dokka-cli:2.3.0
      htmlClasspath:
        - org.jetbrains.dokka:dokka-base:2.3.0
        - org.jetbrains.dokka:analysis-kotlin-symbols:2.3.0
        - org.jetbrains.kotlinx:kotlinx-html-jvm:0.9.1
        - org.freemarker:freemarker:2.3.35
      outputDirectory: ${taskOutputDir}
  dokkaJar:
    action: !io.heapy.ktc.plugins.dokka.generateJavadocJar
      htmlDirectory: ${tasks.dokkaHtml.action.outputDirectory}/html
      moduleName: ${module.name}
      outputDirectory: ${taskOutputDir}

commands:
  - dokkaHtml
  - dokkaJar
