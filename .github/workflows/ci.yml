name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-kotlin-script
      - uses: Heapy/setup-ktc@52e4da5405a2dc056dd0c42ac86390c797d12f5d # v1.0.1
        with:
          version: 0.13.0
      - run: ./kotlin build
      - run: ./kotlin check
      - run: kotlinr scripts/integration.main.kts
